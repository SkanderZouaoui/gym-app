<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav style="position:absolute;left:0;right:0;bottom:0;height:88px;padding:0 4px 22px;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:4">
  <sc-for list="{{ left }}" as="n" hint-placeholder-count="2"><button aria-label="{{ n.label }}" style="position:relative;height:56px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border-radius:var(--r-sm);color:{{ n.fg }}" style-focus="outline:2px solid var(--focus)"><span style="font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-variation-settings:'FILL' {{ n.fill }}">{{ n.icon }}</span><span style="font-size:10px;font-weight:700;white-space:nowrap">{{ n.label }}</span></button></sc-for>
  <div style="display:flex;flex-direction:column;align-items:center;gap:2px"><button aria-label="Scanner" style="width:62px;height:62px;margin-top:-28px;border-radius:999px;border:4px solid var(--surface);display:grid;place-items:center;box-shadow:var(--sh2);cursor:pointer;background:{{ scBg }};color:var(--primary-contrast)" style-focus="outline:2px solid var(--focus);outline-offset:2px"><span style="font-family:'Material Symbols Rounded';font-size:30px;line-height:1">qr_code_scanner</span></button><span style="font-size:10px;font-weight:700;color:{{ scFg }}">Scanner</span></div>
  <sc-for list="{{ right }}" as="n" hint-placeholder-count="2"><button aria-label="{{ n.label }}" style="position:relative;height:56px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border-radius:var(--r-sm);color:{{ n.fg }}" style-focus="outline:2px solid var(--focus)"><span style="font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-variation-settings:'FILL' {{ n.fill }}">{{ n.icon }}</span><span style="font-size:10px;font-weight:700;white-space:nowrap">{{ n.label }}</span><sc-if value="{{ n.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--danger);color:var(--on-danger);font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface)">{{ n.badge }}</span></sc-if></button></sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:110},&quot;active&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:4,&quot;tsType&quot;:&quot;number&quot;},&quot;badge&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:8,&quot;min&quot;:0,&quot;max&quot;:99,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const a=+(this.props.active??0);const b=+(this.props.badge??8);
    const it=[['space_dashboard','Tableau de bord',0],['calendar_month','Planning',1],['group','Adhérents',3],['more_horiz','Plus',4]].map(([icon,label,i])=>({icon,label,fill:a===i?1:0,fg:a===i?'var(--primary-ink)':'var(--muted)',hasBadge:i===4&&b>0,badge:b}));
    return {left:it.slice(0,2),right:it.slice(2),scBg:a===2?'var(--primary-pressed)':'var(--primary)',scFg:a===2?'var(--primary-ink)':'var(--muted)'};
  }
}
</script>
</body>
</html>
