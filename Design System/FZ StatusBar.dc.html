<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:46px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;direction:ltr;position:relative;z-index:3">
  <span>9:41</span>
  <span style="display:flex;gap:4px;align-items:center;font-family:'Material Symbols Rounded';font-size:18px;line-height:1"><span style="color:{{ netColor }}">{{ netIcon }}</span><span>{{ wifi }}</span><span>battery_full</span></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:46},&quot;net&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ok&quot;,&quot;weak&quot;,&quot;off&quot;],&quot;default&quot;:&quot;ok&quot;,&quot;tsType&quot;:&quot;'ok'|'weak'|'off'&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const n=this.props.net||'ok';
    return {netIcon:n==='weak'?'signal_cellular_alt_1_bar':(n==='off'?'signal_cellular_off':'signal_cellular_alt'),wifi:n==='off'?'wifi_off':(n==='weak'?'wifi_1_bar':'wifi'),netColor:n==='ok'?'currentColor':'var(--warning)'};
  }
}
</script>
</body>
</html>
