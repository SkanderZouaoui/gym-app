<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav style="position:absolute;left:0;right:0;bottom:0;height:88px;padding:0 6px 22px;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:4">
  <sc-for list="{{ left }}" as="n" hint-placeholder-count="2">
    <button aria-label="{{ n.label }}" style="height:56px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border-radius:var(--r-sm);color:{{ n.fg }}" style-focus="outline:2px solid var(--focus)"><span style="font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-variation-settings:'FILL' {{ n.fill }}">{{ n.icon }}</span><span style="font-size:10.5px;font-weight:700">{{ n.label }}</span></button>
  </sc-for>
  <div style="display:grid;place-items:center"><button aria-label="QR d’accès" style="width:60px;height:60px;margin-top:-26px;border-radius:999px;border:4px solid var(--surface);display:grid;place-items:center;box-shadow:var(--sh2);cursor:pointer;background:{{ qrBg }};color:{{ qrFg }}" style-focus="outline:2px solid var(--focus);outline-offset:2px"><span style="font-family:'Material Symbols Rounded';font-size:28px;line-height:1">qr_code_2</span></button></div>
  <sc-for list="{{ right }}" as="n" hint-placeholder-count="2">
    <button aria-label="{{ n.label }}" style="height:56px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border-radius:var(--r-sm);color:{{ n.fg }}" style-focus="outline:2px solid var(--focus)"><span style="font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-variation-settings:'FILL' {{ n.fill }}">{{ n.icon }}</span><span style="font-size:10.5px;font-weight:700">{{ n.label }}</span></button>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:100},&quot;active&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:4,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const a=+(this.props.active??0);
    const it=[['home','Accueil',0],['calendar_month','Planning',1],['fitness_center','Entraînement',3],['person','Profil',4]].map(([icon,label,i])=>({icon,label,fill:a===i?1:0,fg:a===i?'var(--primary-ink)':'var(--muted)'}));
    return {left:it.slice(0,2),right:it.slice(2),qrBg:a===2?'var(--primary-pressed)':'var(--primary)',qrFg:'var(--primary-contrast)'};
  }
}
</script>
</body>
</html>
