<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&amp;display=block" rel="stylesheet">
<style>body{margin:0;-webkit-font-smoothing:antialiased}a{color:#7C3AED;text-decoration:none}a:hover{color:#5B21B6;text-decoration:underline}button{font:inherit}</style>
</helmet>
<div style="min-height:100vh;background:#E8E5F1;padding:36px 24px 56px;display:flex;flex-direction:column;align-items:center;gap:24px;font-family:-apple-system,'SF Pro Text','Inter',sans-serif;box-sizing:border-box">
<div style="text-align:center"><div style="font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#5B21B6;font-weight:700">Muscle UP · Splash screen · Option 2</div><div style="font-size:30px;font-weight:800;letter-spacing:-.025em;color:#1B1530;margin-top:6px">Le mouvement</div><div style="font-size:14px;color:#4A4463;margin-top:6px;max-width:540px;text-wrap:pretty">Un point suit la trajectoire du muscle-up : traction, transition, poussée. Il passe au-dessus de la barre, puis le nom se révèle.</div></div>
<button onClick="{{ replay }}" style="border:0;cursor:pointer;height:40px;padding:0 20px;border-radius:999px;background:#7C3AED;color:#fff;font-weight:700;font-size:14px;box-shadow:0 8px 20px rgba(124,58,237,.35)">Rejouer l’animation</button>
<div style="display:flex;gap:44px;flex-wrap:wrap;justify-content:center">
<sc-for list="{{ phones }}" as="p" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;align-items:center;gap:14px">
<div style="width:390px;height:844px;border-radius:54px;overflow:hidden;position:relative;border:10px solid #0B0A12;box-sizing:content-box;box-shadow:0 30px 70px rgba(40,20,90,.35);background:{{ p.bg }}">
<div style="position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 26px)"></div>
<div style="{{ p.glow }}"></div>
<div style="position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0;font-weight:700;font-size:15px;color:#fff;z-index:5"><span>9:41</span><span style="font-family:'Material Symbols Rounded';font-size:18px;letter-spacing:4px">signal_cellular_alt wifi battery_full</span></div>
<div style="position:absolute;left:0;right:0;top:262px;display:flex;justify-content:center"><div style="{{ p.muscle }}">MUSCLE</div></div>
<div style="{{ p.bar }}"></div><div style="{{ p.bar2 }}"></div>
<div style="position:absolute;left:0;right:0;top:362px;height:130px;overflow:hidden;display:flex;justify-content:center"><div style="{{ p.up }}">UP</div></div>
<div style="position:absolute;left:0;right:0;top:510px;text-align:center;{{ p.tag }}">Passe au-dessus.</div>
<div style="{{ p.load }}"><div style="width:140px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden"><div style="{{ p.fill }}"></div></div><div style="font-size:12px;font-weight:600;letter-spacing:.14em;color:rgba(255,255,255,.75)">CHARGEMENT</div></div>
<svg width="390" height="844" style="position:absolute;left:0;top:0">
<polyline points="{{ p.trail }}" style="fill:none;stroke:#DDD6FE;stroke-width:3.5;stroke-dasharray:2 9;stroke-linecap:round;opacity:{{ p.trailO }}"></polyline>
<circle cx="{{ p.dx }}" cy="{{ p.dy }}" r="{{ p.dr }}" style="fill:#fff;opacity:{{ p.dotO }};filter:drop-shadow(0 0 14px rgba(196,181,253,.95))"></circle>
</svg>
<sc-for list="{{ p.labels }}" as="l" hint-placeholder-count="3"><div style="{{ l.st }}"><span style="width:22px;height:22px;border-radius:50%;background:#fff;color:#5B21B6;display:grid;place-items:center;font-size:12px;font-weight:800">{{ l.n }}</span>{{ l.t }}</div></sc-for>
<div style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#fff;opacity:.85"></div>
</div>
<div style="font-size:14px;font-weight:700;color:#1B1530">{{ p.label }}</div>
</div>
</sc-for>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { p: 0, ph: 0 };
  raf = 0; tm = [];
  componentDidMount() { this.run(); }
  componentWillUnmount() { cancelAnimationFrame(this.raf); this.tm.forEach(clearTimeout); }
  run() {
    cancelAnimationFrame(this.raf); this.tm.forEach(clearTimeout);
    this.setState({ p: 0, ph: 0 });
    const D = 2600, t0 = performance.now() + 300;
    const step = now => {
      const k = Math.min(1, Math.max(0, (now - t0) / D));
      this.setState({ p: k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2 });
      if (k < 1) this.raf = requestAnimationFrame(step);
      else { this.setState({ ph: 1 }); this.tm = [[550, 2], [1050, 3], [1500, 4], [2000, 5]].map(([t, q]) => setTimeout(() => this.setState({ ph: q }), t)); }
    };
    this.raf = requestAnimationFrame(step);
  }
  B(t) {
    const P = [[200, 740], [200, 540], [135, 440], [200, 285]], u = 1 - t;
    const f = i => u * u * u * P[0][i] + 3 * u * u * t * P[1][i] + 3 * u * t * t * P[2][i] + t * t * t * P[3][i];
    return [f(0), f(1)];
  }
  renderVals() {
    const { p, ph } = this.state, E = 'cubic-bezier(.2,.9,.25,1.1)';
    const pts = []; for (let i = 0; i <= 80; i++) { const t = i / 80; if (t > p) break; pts.push(this.B(t).map(Math.round).join(',')); }
    const [dx, dy] = this.B(p);
    const labs = [[.04, '1', 'TRACTION'], [.5, '2', 'TRANSITION'], [.9, '3', 'POUSSÉE']].map(([t, n, tx]) => { const [x, y] = this.B(t);
      return { n, t: tx, st: `position:absolute;left:${Math.round(x) + 34}px;top:${Math.round(y) - 11}px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.1em;color:#fff;opacity:${ph >= 1 ? 0 : p >= t ? 1 : 0};transition:opacity .35s ease` }; });
    const mk = (label, bg, glowC) => ({ label, bg, labels: labs,
      glow: `position:absolute;left:50%;top:420px;width:640px;height:640px;margin:-320px 0 0 -320px;border-radius:50%;background:radial-gradient(circle,${glowC} 0%,transparent 65%);opacity:${ph >= 4 ? 1 : .35};transition:opacity 1s ease`,
      trail: pts.join(' '), trailO: ph >= 1 ? 0 : 1, dx, dy, dr: ph >= 1 ? 40 : 10, dotO: ph >= 1 ? 0 : p > 0 ? 1 : 0,
      bar: `position:absolute;left:0;right:0;top:340px;height:12px;background:#fff;box-shadow:0 0 18px rgba(196,181,253,.8);opacity:${ph >= 1 ? 0 : 1};transition:opacity .4s ease`,
      bar2: `position:absolute;left:20px;width:350px;top:340px;height:12px;border-radius:6px;background:#fff;box-shadow:0 0 30px rgba(196,181,253,.7);transform:scaleX(${ph >= 3 ? 1 : 0});transform-origin:left;transition:transform .55s cubic-bezier(.7,0,.2,1)`,
      load: `position:absolute;left:0;right:0;bottom:90px;display:flex;flex-direction:column;align-items:center;gap:12px;opacity:${ph >= 5 ? 1 : 0};transition:opacity .4s ease`,
      fill: `height:100%;border-radius:2px;background:#fff;width:${ph >= 5 ? '100%' : '0%'};transition:width 1.8s cubic-bezier(.5,0,.2,1)`,
      muscle: `font-size:68px;font-weight:900;font-style:italic;letter-spacing:-.03em;line-height:1;color:transparent;-webkit-text-stroke:2px #fff;opacity:${ph >= 2 ? 1 : 0};transform:translateX(${ph >= 2 ? 0 : -16}px);transition:all .55s ease`,
      up: `font-size:150px;font-weight:900;font-style:italic;letter-spacing:-.06em;line-height:.9;color:#fff;transform:translateY(${ph >= 4 ? 0 : 150}px);transition:transform .65s ${E}`,
      tag: `font-size:16px;font-weight:500;color:rgba(255,255,255,.9);opacity:${ph >= 5 ? 1 : 0};transition:opacity .5s ease` });
    return { replay: () => this.run(), phones: [
      mk('Violet (principal)', 'linear-gradient(160deg,#8B5CF6 0%,#6D28D9 45%,#2E1065 100%)', 'rgba(196,181,253,.35)'),
      mk('Sombre', '#0F0B1E', 'rgba(124,58,237,.45)')] };
  }
}
</script>
</body>
</html>
