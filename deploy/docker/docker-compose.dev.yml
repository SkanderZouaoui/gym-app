services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: muscleup
      POSTGRES_PASSWORD: muscleup
      POSTGRES_DB: muscleup
    ports:
      - "5432:5432"
    volumes:
      - muscleup_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: muscleup
      MINIO_ROOT_PASSWORD: change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - muscleup_minio_data:/data

volumes:
  muscleup_postgres_data:
  muscleup_minio_data:
