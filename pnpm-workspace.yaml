packages:
  - "backend"
  - "mobile"
  - "backoffice"
  - "packages/*"

allowBuilds:
  '@scarf/scarf': false
  argon2: true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  workerd: false
  unrs-resolver: false

overrides:
  body-parser: ">=2.4.0"
  qs: ">=6.16.1"
  multer: ">=2.5.0"
  zod: ">=4.6.6"

minimumReleaseAgeExclude:
  - body-parser@2.4.0
  - qs@6.17.1
  - multer@2.5.0
  - zod@4.6.7
  - "@expo/cli@58.1.17"
  - "@expo/config-plugins@58.0.11"
  - "@expo/config@58.0.9"
  - "@expo/image-utils@0.12.6"
  - "@expo/inline-modules@0.2.8"
  - "@expo/local-build-cache-provider@58.0.9"
  - "@expo/metro-config@58.0.19"
  - "@expo/modules-macros-linux-arm64@0.27.1"
  - "@expo/modules-macros-linux-x64@0.27.1"
  - "@expo/modules-macros-win32-arm64@0.27.1"
  - "@expo/modules-macros-win32-x64@0.27.1"
  - "@expo/prebuild-config@58.0.17"
  - "@expo/require-utils@58.0.5"
  - "@expo/router-server@58.0.19"
  - "@noxcturnal/noxcturnal-win32-x64-msvc@0.1.11"
  - babel-preset-expo@58.0.22
  - expo-asset@58.0.19
  - expo-constants@58.0.14
  - expo-file-system@58.0.13
  - expo-font@58.0.11
  - expo-modules-autolinking@58.0.16
  - expo-modules-cli@0.4.0
  - expo-modules-core@58.0.28
  - expo-modules-jsi@58.0.21
  - expo-modules-macros@0.27.1
  - expo@58.0.21
  - expo-camera@58.0.14
  - expo-dev-client@58.0.17
  - expo-dev-launcher@58.0.17
  - expo-image@58.0.18
  - expo-linking@58.0.15
  - expo-notifications@58.1.7
  - expo-router@58.0.28
  - expo-splash-screen@58.0.12
  - expo-video@58.0.13
