services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-muscleup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-muscleup}
      POSTGRES_DB: ${POSTGRES_DB:-muscleup}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - muscleup_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-muscleup}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  muscleup_postgres_data:
