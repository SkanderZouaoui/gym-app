# Déploiement MVP sur Render (plan gratuit) : API NestJS en Docker.
# Base de données et stockage = Supabase (Storage via le protocole S3). Pas de Redis (non utilisé par l'API).
# Les variables `sync: false` sont à renseigner dans le dashboard Render.

services:
  - type: web
    name: muscleup-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: TRUST_PROXY
        value: "1"
      # Supabase : « Session pooler » (port 5432, hôte *.pooler.supabase.com), compatible IPv4 et migrations Prisma.
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: QR_KEY_ENCRYPTION_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      # Supabase Storage (protocole S3 : Storage > S3 Configuration)
      - key: S3_ENDPOINT
        value: https://wboavnrfprhdqzgjbawz.storage.supabase.co/storage/v1/s3
      - key: S3_PUBLIC_ENDPOINT
        value: https://wboavnrfprhdqzgjbawz.storage.supabase.co/storage/v1/s3
      - key: S3_REGION
        value: eu-west-1
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_BUCKET
        value: muscleup
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # URL publique de l'API et origines du back-office (séparées par des virgules)
      - key: PUBLIC_API_URL
        value: https://muscleup-api-8a6p.onrender.com
      - key: CORS_ORIGINS
        sync: false
      - key: APP_SCHEME
        value: muscleup
      # Emails (optionnel, ex. Brevo)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_BRAND
        value: MuscleUP

  # Back-office (Vite/React) servi comme site statique.
  - type: web
    name: muscleup-backoffice
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @muscleup/shared build && pnpm --filter @muscleup/backoffice build
    staticPublishPath: backoffice/dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://muscleup-api-8a6p.onrender.com
    routes:
      # SPA : toutes les routes renvoient vers index.html
      - type: rewrite
        source: /*
        destination: /index.html
